name: Auto Daily Cyber-Intelpas Report

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Mengunduh Kode Repositori
        uses: actions/checkout@v4

      - name: 2. Menyiapkan Lingkungan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Memperbarui Pip & Menginstal Seluruh Modul
        run: |
          python -m pip install --upgrade pip
          pip install streamlit weasyprint jinja2 requests pandas gspread google-auth

      - name: 4. Menjalankan Skrip Laporan Harian Otomatis
        env:
          STREAMLIT_SECRETS_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STREAMLIT_SECRETS_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/auto_daily_job.py