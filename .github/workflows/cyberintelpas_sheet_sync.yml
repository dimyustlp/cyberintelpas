name: Sinkronisasi Spreadsheet CyberIntelPAS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Validasi GitHub Secrets
        shell: bash
        env:
          FUNCTION_URL: ${{ secrets.SHEET_SYNC_FUNCTION_URL }}
          SYNC_TOKEN: ${{ secrets.SHEET_SYNC_TOKEN }}
        run: |
          if [ -z "$FUNCTION_URL" ]; then
            echo "::error::SHEET_SYNC_FUNCTION_URL belum diisi."
            exit 1
          fi

          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SHEET_SYNC_TOKEN belum diisi."
            exit 1
          fi

          echo "GitHub Secrets tersedia."

      - name: Jalankan sinkronisasi spreadsheet
        shell: bash
        env:
          FUNCTION_URL: ${{ secrets.SHEET_SYNC_FUNCTION_URL }}
          SYNC_TOKEN: ${{ secrets.SHEET_SYNC_TOKEN }}
        run: |
          set +e

          RESPONSE=$(curl --silent --show-error \
            --connect-timeout 30 \
            --max-time 300 \
            --write-out $'\n%{http_code}' \
            --request POST \
            "$FUNCTION_URL" \
            --header "x-sync-token: $SYNC_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"trigger_type":"github_actions"}')

          CURL_EXIT=$?
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "======================================"
          echo "HTTP status: $HTTP_CODE"
          echo "Respons Edge Function:"
          echo "$BODY"
          echo "======================================"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Curl gagal dengan exit code $CURL_EXIT."
            exit 1
          fi

          if ! [[ "$HTTP_CODE" =~ ^[0-9]{3}$ ]]; then
            echo "::error::HTTP status tidak valid: $HTTP_CODE"
            exit 1
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Sinkronisasi diterima oleh Edge Function."
            exit 0
          fi

          echo "::error::Edge Function mengembalikan HTTP $HTTP_CODE."
          exit 1
